name: diun

services:
  diun:
    container_name: diun
    image: crazymax/diun:latest
    command: serve
    volumes:
      - "/home/saar/docker/diun:/data"
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      - "TZ=Israel"
      - "DIUN_WATCH_WORKERS=20"
      - "DIUN_WATCH_SCHEDULE=7 10 * * *"
      - "DIUN_WATCH_JITTER=30s"
      - "DIUN_PROVIDERS_DOCKER=true"
      - "DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true"

      - "DIUN_NOTIF_MAIL_HOST=smtp.gmail.com"
      - "DIUN_NOTIF_MAIL_PORT=587"
      - "DIUN_NOTIF_MAIL_SSL=false"
      - "DIUN_NOTIF_MAIL_INSECURESKIPVERIFY=false"
      - "DIUN_NOTIF_MAIL_USERNAME=saarkoren6@gmail.com"
      - "DIUN_NOTIF_MAIL_PASSWORD=REDACTED"
      - "DIUN_NOTIF_MAIL_FROM=saarkoren6@gmail.com"
      - "DIUN_NOTIF_MAIL_TO=saarkoren6@gmail.com"
    labels:
      - "diun.enable=true"
    restart: always
