name: plex

services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: "plex"
    network_mode: "host"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Israel
      - VERSION=docker
    volumes:
      - "/home/saar/docker/plex/movies:/movies"
      - "/home/saar/docker/plex/music:/music"
      - "/home/saar/docker/plex/tv:/tv"
      - "plex_config:/config"
    restart: "unless-stopped"

volumes:
  plex_config:
    external: true
