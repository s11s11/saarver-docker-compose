services:
  transmission:
    image: linuxserver/transmission:latest
    container_name: transmission

    environment:
      - PUID=1000
      - PGID=1000

    ports:
      - "51413:51413/tcp"
      - "51413:51413/udp"
      - "9091:9091/tcp"

    volumes:
      - /srv/transmission/downloads:/downloads

    restart: unless-stopped
